name: Audit backend foundation

on:
  push:
    branches: ["backend-foundation"]
  pull_request:
    branches: ["main", "backend-foundation"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run AutoType static audit
        run: python3 scripts/audit.py

name: Audit backend foundation

on:
  push:
    branches: ["backend-foundation", "beta-friends"]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: ["main", "backend-foundation", "beta-friends"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run AutoType static audit
        run: python3 scripts/audit.py

  phase1:
    name: Phase 1 regression tests
    if: github.event_name == 'pull_request' && github.base_ref == 'beta-friends'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked test dependencies
        run: npm ci
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
      # PGlite is in memory, Auth/Stripe are mocks, and no service secrets are
      # supplied. A separate network namespace also blocks unexpected egress.
      - name: Run isolated Phase 1 regressions
        run: sudo unshare --net -- env "PATH=$PATH" npm run test:phase1

  phase1-native:
    name: Phase 1 native PostgreSQL concurrency
    if: github.event_name == 'pull_request' && github.base_ref == 'beta-friends'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Use the runner's existing PostgreSQL 16 and libpq; no apt installs,
      # Docker images, hosted URLs, service secrets or persistent databases.
      # Run as the runner user: initdb must not run as root. The server and all
      # test connections share a network namespace with no external network.
      - name: Run native multi-connection fixtures without external networking
        run: >-
          sudo unshare --net -- sudo -u "$(id -un)" -- env "PATH=$PATH"
          python3 scripts/test_phase1_native.py --pg-bin /usr/lib/postgresql/16/bin

  phase1-fullstack:
    name: Phase 1 full Supabase PostgreSQL 17 integration
    if: >-
      github.event_name == 'pull_request' && github.base_ref == 'beta-friends'
      && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: phase1-fullstack-stable-cli-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      AUTOTYPE_CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # Public standard runner compute is free. No cache, artifact upload,
      # Packages publication, hosted links, service secrets or deployments.
      - name: Install locked integration dependencies
        run: npm ci
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
      - name: Install verified pinned CLI on disposable runner only
        run: |
          curl --fail --location --silent --show-error https://github.com/supabase/cli/releases/download/v2.75.0/supabase_linux_amd64.tar.gz -o "$RUNNER_TEMP/supabase.tar.gz"
          printf 'e5597462f865d5ac72af0453358e37ecb0d85962ad6914a114a53de847303bde  %s\n' "$RUNNER_TEMP/supabase.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/supabase-bin"
          tar -xzf "$RUNNER_TEMP/supabase.tar.gz" -C "$RUNNER_TEMP/supabase-bin" supabase
          echo "$RUNNER_TEMP/supabase-bin" >> "$GITHUB_PATH"
      - name: Discover CLI commands and prepare isolated fixture project
        run: |
          supabase --version
          supabase start --help
          supabase status --help
          supabase db reset --help
          supabase stop --help
          python3 scripts/fullstack/prepare.py
      - name: Start actual PostgreSQL 17 and all required Supabase services
        timeout-minutes: 12
        run: python3 scripts/fullstack/start.py
      - name: Block external networking after dependency warm-up
        run: python3 scripts/fullstack/isolate.py
      - name: Test synthetic upgrade and real Auth RLS gameplay Storage Realtime Functions
        run: node --require ./scripts/fullstack/network-guard.cjs --test --test-concurrency=1 scripts/fullstack-phase1.test.cjs
        env:
          AUTOTYPE_STACK_SCENARIO: upgrade
      - name: Reset only disposable local stack for fresh-install validation
        run: |
          python3 -c 'import os,pathlib,shutil; target=pathlib.Path(os.environ["AUTOTYPE_STACK_DIR"])/"supabase/migrations"; [shutil.copy(p,target/p.name) for p in pathlib.Path("supabase/migrations").glob("*.sql") if "_phase1_" in p.name]'
          supabase db reset --local --workdir "$AUTOTYPE_STACK_DIR" --no-seed
      - name: Repeat integration matrix on fresh installation
        run: node --require ./scripts/fullstack/network-guard.cjs --test --test-concurrency=1 scripts/fullstack-phase1.test.cjs
        env:
          AUTOTYPE_STACK_SCENARIO: fresh
      - name: Run 15 real multi-connection scenarios on the actual Supabase PostgreSQL 17 database
        run: python3 scripts/test_phase1_fullstack_native.py
      - name: Stop and remove only this disposable fixture stack
        if: always() && env.AUTOTYPE_STACK_DIR != ''
        run: timeout 120s supabase stop --workdir "$AUTOTYPE_STACK_DIR" --no-backup

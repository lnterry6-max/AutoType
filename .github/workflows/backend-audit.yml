name: Audit backend foundation

on:
  push:
    branches: ["backend-foundation", "release-hardening"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run AutoType static audit
        run: python3 scripts/audit.py

      - name: Package test build
        run: |
          zip -qr AutoType-release-hardening-test.zip . \
            -x ".git/*" "AutoType-release-hardening-test.zip"

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: AutoType-release-hardening-test
          path: AutoType-release-hardening-test.zip
          if-no-files-found: error
